openapi: 3.1.0
info:
  title: Aramya Fashion API
  version: 0.1.0
  description: Database-backed catalog, customer session, persistent cart, provisional checkout, customer order history, and order detail APIs. Payment and fulfillment integrations remain unimplemented.
servers:
  - url: http://localhost:18080
paths:
  /health:
    get:
      summary: Process health
      responses:
        '200':
          description: Process is running
  /ready:
    get:
      summary: Database readiness
      responses:
        '200':
          description: Database is reachable
        '503':
          description: Database is unavailable
  /api/v1/admin/inventory:
    get:
      summary: List product variant inventory for administrators
      description: Includes tracked, made-to-order, and untracked variants. Only tracked variants can be adjusted.
      security:
        - sessionCookie: []
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200':
          description: Inventory variants and current reserved quantities
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminInventoryItem' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { description: Administrator session is required }
        '403': { description: Session does not have the admin role }
  /api/v1/admin/inventory/{variantID}:
    patch:
      summary: Set the on-hand quantity for a tracked variant
      description: Uses expectedOnHand for optimistic concurrency; changes below reserved stock are rejected. The adjustment ledger and audit log are written atomically.
      security:
        - sessionCookie: []
          csrfToken: []
          csrfCookie: []
      parameters:
        - { in: path, name: variantID, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
        - { in: cookie, name: aramya_csrf, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedOnHand, onHand, reason]
              properties:
                expectedOnHand: { type: integer, minimum: 0, maximum: 1000000 }
                onHand: { type: integer, minimum: 0, maximum: 1000000 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Inventory updated with a ledger movement and audit entry }
        '400': { description: Invalid quantity, reason, or inventory policy }
        '401': { description: Administrator session is required }
        '403': { description: Admin role or CSRF validation failed }
        '404': { description: Product variant was not found }
        '409': { description: On-hand value is stale or would fall below reserved stock }
  /api/v1/admin/appointments:
    get:
      summary: List appointments for administrators
      description: Searches the staff request queue. Requires an authenticated session with the admin role.
      security:
        - sessionCookie: []
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [requested, confirmed, completed, cancelled] } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200':
          description: Appointment request page
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminAppointment' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { description: Administrator session is required }
        '403': { description: Session does not have the admin role }
  /api/v1/admin/appointments/{id}:
    patch:
      summary: Change an appointment status
      description: Applies the appointment transition matrix and writes an audit log in the same transaction.
      security:
        - sessionCookie: []
          csrfToken: []
          csrfCookie: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
        - { in: cookie, name: aramya_csrf, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedStatus, status]
              properties:
                expectedStatus: { type: string, enum: [requested, confirmed, completed, cancelled] }
                status: { type: string, enum: [confirmed, completed, cancelled] }
      responses:
        '200': { description: Appointment and audit event persisted }
        '400': { description: Invalid transition or request ID }
        '401': { description: Administrator session is required }
        '403': { description: Admin role or CSRF validation failed }
        '404': { description: Appointment was not found }
        '409': { description: Request is stale or transition is no longer allowed }
  /api/v1/admin/custom-order-requests:
    get:
      summary: List made-to-order requests for administrators
      description: Searches requests requiring staff review. Requires an authenticated session with the admin role.
      security:
        - sessionCookie: []
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [requested, reviewing, fitting, quoted, awaiting_approval, approved, in_progress, completed, declined, cancelled] } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200':
          description: Custom order request page
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCustomOrderRequest' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { description: Administrator session is required }
        '403': { description: Session does not have the admin role }
  /api/v1/admin/custom-order-requests/{id}:
    patch:
      summary: Advance a made-to-order request or issue a quotation
      description: Enforces fitting and quote transitions. Customer approval is not available through this staff route. Status changes and audit events are transactional.
      security:
        - sessionCookie: []
          csrfToken: []
          csrfCookie: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
        - { in: cookie, name: aramya_csrf, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedStatus, status]
              properties:
                expectedStatus: { type: string, enum: [requested, reviewing, fitting, quoted, awaiting_approval] }
                status: { type: string, enum: [reviewing, fitting, quoted, awaiting_approval, declined, cancelled] }
                quotationPaise: { type: integer, minimum: 1, description: Required only when status is quoted; amount in integer paise. }
      responses:
        '200': { description: Request and audit event persisted }
        '400': { description: Invalid transition or quotation }
        '401': { description: Administrator session is required }
        '403': { description: Admin role or CSRF validation failed }
        '404': { description: Request was not found }
        '409': { description: Request is stale or transition is no longer allowed }
  /api/v1/categories:
    get:
      summary: List active catalog categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
  /api/v1/auth/csrf:
    get:
      summary: Create or read the browser CSRF token
      responses:
        '200':
          description: CSRF token cookie is set and token is returned
  /api/v1/auth/register:
    post:
      summary: Register a customer and create a session
      parameters:
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 128 }
                displayName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201': { description: Customer registered; session is set in an HTTP-only cookie }
        '400': { description: Invalid registration input }
        '409': { description: Email already registered }
  /api/v1/auth/login:
    post:
      summary: Authenticate with email and password
      parameters:
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 128 }
      responses:
        '200': { description: Authenticated; rotated HTTP-only session cookie is set }
        '401': { description: Email or password is incorrect }
  /api/v1/auth/logout:
    post:
      summary: Revoke the current customer session
      security: [{ sessionCookie: [], csrfToken: [], csrfCookie: [] }]
      responses:
        '204': { description: Session revoked and cookies cleared }
        '403': { description: CSRF token rejected }
  /api/v1/auth/me:
    get:
      summary: Read the current customer identity
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current customer }
        '401': { description: Session is missing, expired, or revoked }
  /api/v1/cart:
    get:
      summary: Read or create the persistent guest/customer cart
      responses:
        '200': { description: Cart lines and server-calculated subtotal }
  /api/v1/cart/items:
    post:
      summary: Add a product variant to the persistent cart
      parameters:
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, quantity]
              properties:
                variantId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '200': { description: Updated cart and server-calculated subtotal }
        '404': { description: Product variant is unavailable }
        '409': { description: Insufficient stock }
  /api/v1/cart/items/{id}:
    patch:
      summary: Set a cart line quantity; zero removes the line
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 20 }
      responses:
        '200': { description: Updated cart }
        '404': { description: Cart line was not found }
    delete:
      summary: Remove a cart line
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated cart }
        '404': { description: Cart line was not found }
  /api/v1/checkout/quote:
    post:
      summary: Recalculate the current cart using database prices
      parameters:
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Provisional server-calculated quote; payment availability is reported explicitly }
        '409': { description: Cart is empty or stock is no longer available }
  /api/v1/checkout/orders:
    post:
      summary: Create an idempotent pending-payment order snapshot from the current cart
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, address]
              properties:
                email: { type: string, format: email }
                phone: { type: string, minLength: 7, maxLength: 32 }
                customerNote: { type: string, maxLength: 1000 }
                address:
                  type: object
                  required: [recipientName, phone, line1, city, region, postalCode, countryCode]
                  properties:
                    recipientName: { type: string, maxLength: 120 }
                    phone: { type: string, minLength: 7, maxLength: 32 }
                    line1: { type: string, maxLength: 200 }
                    line2: { type: string, maxLength: 200 }
                    city: { type: string, maxLength: 120 }
                    region: { type: string, maxLength: 120 }
                    postalCode: { type: string, minLength: 3, maxLength: 24 }
                    countryCode: { type: string, pattern: '^[A-Z]{2}$' }
      responses:
        '201': { description: Order saved in pending_payment state; paymentAvailable is false until a provider is configured }
        '200': { description: Idempotent replay of the original order response }
        '400': { description: Invalid checkout details or idempotency key }
        '409': { description: Empty cart, insufficient stock, or idempotency conflict }
  /api/v1/orders:
    get:
      summary: List orders belonging to the authenticated customer
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200':
          description: Customer order page
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
                  pagination:
                    type: object
                    required: [limit, offset, count, hasMore]
                    properties:
                      limit: { type: integer }
                      offset: { type: integer }
                      count: { type: integer }
                      hasMore: { type: boolean }
        '401': { description: Customer session is missing, expired, or revoked }
        '400': { description: Invalid pagination parameters }
  /api/v1/orders/{id}:
    get:
      summary: Get an order owned by the authenticated customer
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order details and checkout snapshots
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OrderDetail' }
        '400': { description: Invalid order ID }
        '401': { description: Customer session is missing, expired, or revoked }
        '404': { description: Order does not exist for this customer }
  /api/v1/appointments:
    post:
      summary: Save a guest or customer studio appointment request
      security: [{ csrfToken: [], csrfCookie: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentRequest' }
      responses:
        '201':
          description: Appointment request saved with requested status; this does not confirm a time
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CreatedStudioRequest' }
        '200': { description: Idempotent replay of the original request result }
        '400': { description: Invalid name or contact details }
        '409': { description: Request key was already used with different details }
        '403': { description: CSRF token rejected }
        '429': { description: Studio request rate limit exceeded }
  /api/v1/custom-order-requests:
    post:
      summary: Save a guest or customer custom garment inquiry for studio review and quotation
      security: [{ csrfToken: [], csrfCookie: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomOrderRequest' }
      responses:
        '201':
          description: Custom inquiry saved in requested status; no order or payment is created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CreatedStudioRequest' }
        '200': { description: Idempotent replay of the original request result }
        '400': { description: Invalid request details }
        '409': { description: Request key was already used with different details }
        '403': { description: CSRF token rejected }
        '429': { description: Studio request rate limit exceeded }
  /api/v1/products:
    get:
      summary: Search and paginate active products
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    type: object
                    required: [limit, offset, count]
                    properties:
                      limit: { type: integer }
                      offset: { type: integer }
                      count: { type: integer }
  /api/v1/products/{slug}:
    get:
      summary: Get an active product by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProductDetail'
        '404':
          description: Product not found
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aramya_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    csrfCookie:
      type: apiKey
      in: cookie
      name: aramya_csrf
  schemas:
    Category:
      type: object
      required: [id, slug, name, subtitle, imageKey, sortOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        subtitle: { type: string }
        imageKey: { type: string }
        sortOrder: { type: integer }
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
    Product:
      type: object
      required: [id, defaultVariantId, sku, slug, name, description, categoryId, categorySlug, categoryName, pricePaise, currency, imageKey, status, inventoryPolicy]
      properties:
        id: { type: string, format: uuid }
        defaultVariantId: { type: string, format: uuid }
        sku: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        categoryId: { type: string, format: uuid }
        categorySlug: { type: string }
        categoryName: { type: string }
        pricePaise: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        imageKey: { type: string }
        status: { type: string }
        inventoryPolicy: { type: string }
    ProductVariant:
      type: object
      required: [id, sku, optionName, optionValue, priceAdjustmentPaise, isDefault, available]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        optionName: { type: string }
        optionValue: { type: string }
        priceAdjustmentPaise: { type: integer }
        isDefault: { type: boolean }
        available: { type: boolean }
    ProductImage:
      type: object
      required: [imageKey, altText]
      properties:
        imageKey: { type: string }
        altText: { type: string }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [variants, images]
          properties:
            variants:
              type: array
              items: { $ref: '#/components/schemas/ProductVariant' }
            images:
              type: array
              items: { $ref: '#/components/schemas/ProductImage' }
    AppointmentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        interest: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 1000 }
      description: At least one of email or phone must be a valid contact method.
    CustomOrderRequest:
      type: object
      required: [name, garmentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        garmentType: { type: string, minLength: 1, maxLength: 120 }
        occasion: { type: string, maxLength: 160 }
        requirements: { type: string, maxLength: 3000 }
      description: At least one of email or phone must be a valid contact method. The request is quoted and approved before any order or payment.
    CreatedStudioRequest:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, const: requested }
        createdAt: { type: string, format: date-time }
    Pagination:
      type: object
      required: [limit, offset, count, hasMore]
      properties:
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        count: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
    AdminAppointment:
      type: object
      required: [id, name, email, phone, preferredAt, interest, note, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        preferredAt: { type: [string, 'null'], format: date-time }
        interest: { type: string }
        note: { type: string }
        status: { type: string, enum: [requested, confirmed, completed, cancelled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminCustomOrderRequest:
      type: object
      required: [id, name, email, phone, garmentType, occasion, requirements, measurements, quotationPaise, currency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        garmentType: { type: string }
        occasion: { type: string }
        requirements: { type: string }
        measurements: { type: object, additionalProperties: true }
        quotationPaise: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status: { type: string, enum: [requested, reviewing, fitting, quoted, awaiting_approval, approved, in_progress, completed, declined, cancelled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminInventoryItem:
      type: object
      required: [variantId, productId, sku, productName, productSlug, categoryName, optionName, optionValue, pricePaise, inventoryPolicy, active, onHand, reserved, available, updatedAt]
      properties:
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        productSlug: { type: string }
        categoryName: { type: string }
        optionName: { type: string }
        optionValue: { type: string }
        pricePaise: { type: integer, minimum: 0 }
        inventoryPolicy: { type: string, enum: [tracked, made_to_order, untracked] }
        active: { type: boolean }
        onHand: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        available: { type: integer }
        updatedAt: { type: string, format: date-time }
    OrderSummary:
      type: object
      required: [id, orderNumber, status, currency, subtotalPaise, taxPaise, shippingPaise, discountPaise, totalPaise, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        status: { type: string, enum: [pending_payment, paid, confirmed, processing, ready_to_ship, shipped, delivered, cancelled, refund_pending, refunded] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        subtotalPaise: { type: integer, minimum: 0 }
        taxPaise: { type: integer, minimum: 0 }
        shippingPaise: { type: integer, minimum: 0 }
        discountPaise: { type: integer, minimum: 0 }
        totalPaise: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    OrderItem:
      type: object
      required: [id, productId, variantId, productName, productSku, variantDescription, quantity, unitPricePaise, taxPaise, lineTotalPaise]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        productName: { type: string }
        productSku: { type: string }
        variantDescription: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPricePaise: { type: integer, minimum: 0 }
        taxPaise: { type: integer, minimum: 0 }
        lineTotalPaise: { type: integer, minimum: 0 }
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [shippingAddress, customerNote, items]
          properties:
            shippingAddress: { type: object, additionalProperties: true }
            customerNote: { type: string }
            items:
              type: array
              items: { $ref: '#/components/schemas/OrderItem' }
