openapi: 3.1.0
info:
  title: Aramya Fashion API
  version: 0.1.0
  description: Database-backed catalog API with initial customer session endpoints. Cart, checkout, and fulfillment operations are not implemented.
servers:
  - url: http://localhost:18080
paths:
  /health:
    get:
      summary: Process health
      responses:
        '200':
          description: Process is running
  /ready:
    get:
      summary: Database readiness
      responses:
        '200':
          description: Database is reachable
        '503':
          description: Database is unavailable
  /api/v1/categories:
    get:
      summary: List active catalog categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
  /api/v1/auth/csrf:
    get:
      summary: Create or read the browser CSRF token
      responses:
        '200':
          description: CSRF token cookie is set and token is returned
  /api/v1/auth/register:
    post:
      summary: Register a customer and create a session
      parameters:
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 128 }
                displayName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201': { description: Customer registered; session is set in an HTTP-only cookie }
        '400': { description: Invalid registration input }
        '409': { description: Email already registered }
  /api/v1/auth/login:
    post:
      summary: Authenticate with email and password
      parameters:
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 128 }
      responses:
        '200': { description: Authenticated; rotated HTTP-only session cookie is set }
        '401': { description: Email or password is incorrect }
  /api/v1/auth/logout:
    post:
      summary: Revoke the current customer session
      security: [{ sessionCookie: [], csrfToken: [], csrfCookie: [] }]
      responses:
        '204': { description: Session revoked and cookies cleared }
        '403': { description: CSRF token rejected }
  /api/v1/auth/me:
    get:
      summary: Read the current customer identity
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current customer }
        '401': { description: Session is missing, expired, or revoked }
  /api/v1/cart:
    get:
      summary: Read or create the persistent guest/customer cart
      responses:
        '200': { description: Cart lines and server-calculated subtotal }
  /api/v1/cart/items:
    post:
      summary: Add a product variant to the persistent cart
      parameters:
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, quantity]
              properties:
                variantId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '200': { description: Updated cart and server-calculated subtotal }
        '404': { description: Product variant is unavailable }
        '409': { description: Insufficient stock }
  /api/v1/cart/items/{id}:
    patch:
      summary: Set a cart line quantity; zero removes the line
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 20 }
      responses:
        '200': { description: Updated cart }
        '404': { description: Cart line was not found }
        '409': { description: Insufficient stock }
    delete:
      summary: Remove a cart line
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: cookie
          name: aramya_csrf
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated cart }
        '404': { description: Cart line was not found }
  /api/v1/products:
    get:
      summary: Search and paginate active products
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    type: object
                    required: [limit, offset, count]
                    properties:
                      limit: { type: integer }
                      offset: { type: integer }
                      count: { type: integer }
  /api/v1/products/{slug}:
    get:
      summary: Get an active product by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aramya_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    csrfCookie:
      type: apiKey
      in: cookie
      name: aramya_csrf
  schemas:
    Category:
      type: object
      required: [id, slug, name, subtitle, imageKey, sortOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        subtitle: { type: string }
        imageKey: { type: string }
        sortOrder: { type: integer }
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
    Product:
      type: object
      required: [id, defaultVariantId, sku, slug, name, description, categoryId, categorySlug, categoryName, pricePaise, currency, imageKey, status, inventoryPolicy]
      properties:
        id: { type: string, format: uuid }
        defaultVariantId: { type: string, format: uuid }
        sku: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        categoryId: { type: string, format: uuid }
        categorySlug: { type: string }
        categoryName: { type: string }
        pricePaise: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        imageKey: { type: string }
        status: { type: string }
        inventoryPolicy: { type: string }
