groups:
  - name: aramya-api
    rules:
      - alert: AramyaAPIHighServerErrorRate
        expr: |
          sum(rate(aramya_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(aramya_http_requests_total[5m])), 0.01) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Aramya API server error rate is above 5%
          description: Inspect API logs using request IDs and check database and upstream dependencies.

      - alert: AramyaDatabaseNotReady
        expr: aramya_database_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Aramya API cannot reach PostgreSQL
          description: Check database availability, connectivity, and pool saturation before restarting services.

      - alert: AramyaAPIHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(aramya_http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Aramya API p95 latency exceeds 1.5 seconds
          description: Check API saturation and database query behavior.

      - alert: AramyaInventoryReservationFailures
        expr: sum(increase(aramya_inventory_reservation_attempts_total{outcome="failed"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Tracked inventory reservations are failing
          description: Check checkout transaction failures and inventory rows; do not adjust stock counters manually without reconciling reservations and ledger entries.

      - alert: AramyaPaymentWebhookProcessingFailures
        expr: sum(increase(aramya_payment_webhook_events_total{outcome="failed"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Razorpay webhook processing failed
          description: Check sanitized API errors, PostgreSQL readiness, and webhook transaction health; Razorpay may retry failed deliveries.
